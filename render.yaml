databases:
  - name: central-comercial-db
    plan: free
    databaseName: central_comercial
    user: central_comercial

services:
  - type: web
    name: central-comercial
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn commercial_project.wsgi:application
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: central-comercial-db
          property: connectionString
